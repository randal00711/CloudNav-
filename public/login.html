<!DOCTYPE html>

<html lang="zh-CN">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>
CloudNav 登录
</title>


<style>

body{

height:100vh;

display:flex;

justify-content:center;

align-items:center;

background:#f5f5f5;

font-family:
Arial,
"Microsoft YaHei";

}


.box{

background:white;

padding:40px;

border-radius:12px;

box-shadow:
0 10px 30px #ddd;

text-align:center;

}


input{

width:240px;

padding:12px;

margin:15px;

border-radius:6px;

border:1px solid #ddd;

}


button{

width:260px;

padding:12px;

background:#1677ff;

color:white;

border:0;

border-radius:6px;

cursor:pointer;

}


</style>


</head>


<body>


<div class="box">


<h2>
CloudNav
</h2>


<p>
请输入访问密码
</p>


<input
id="password"
type="password"
placeholder="访问密码"
/>


<br>


<button onclick="login()">

进入导航

</button>


<p id="msg"></p>


</div>



<script>


async function login(){


const password =
document.querySelector(
"#password"
).value;



const res =
await fetch(
"/api/auth",
{

method:"POST",

headers:{

"Content-Type":
"application/json"

},

body:
JSON.stringify({

password

})

});


const data =
await res.json();



if(data.success){


location.href="/";


}
else{


document.querySelector(
"#msg"
).innerText =
data.message;


}



}


</script>


</body>

</html>
</html>
